<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><title>KMS Control</title><style>
body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:560px;margin:auto;padding:18px 16px 90px}header{display:flex;justify-content:space-between}h1{font-size:28px}.card{background:#fff;border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 1px 5px #0001}.hero{text-align:center}.km{font-size:44px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f2f2f7;border-radius:15px;padding:15px}.metric b{display:block;font-size:24px;margin-top:5px}button{width:100%;padding:15px;border:0;border-radius:14px;background:#111;color:#fff;font-size:17px;font-weight:700;margin-top:10px}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:20px;margin-top:7px;box-sizing:border-box}.hidden{display:none}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px}nav button{background:none;color:#555;margin:0;padding:7px;font-size:13px}.red{color:#c00}.green{color:#16833b}table{width:100%;border-collapse:collapse}td,th{padding:9px 4px;border-bottom:1px solid #eee;text-align:right}td:first-child,th:first-child{text-align:left}
</style></head><body><div class="app"><header><h1>KMS Control</h1><b>🚙 Kia EV3</b></header>
<section id="home"><div class="card hero"><small>Kilometraje actual</small><div id="km" class="km">—</div><div id="status"></div></div><div class="grid"><div class="metric">Límite<b id="limit">9.000</b>km</div><div class="metric">Hechos de más<b id="excess">—</b>km</div><div class="metric">Saldo<b id="balance">—</b>km</div><div class="metric">Km/día<b id="day">—</b></div></div><div class="card" id="info">Registra el kilometraje.</div><button onclick="show('register')">+ Registrar kilometraje</button></section>
<section id="register" class="hidden"><div class="card"><h2>Registrar kilometraje</h2><input id="input" type="number" inputmode="numeric" placeholder="9466"><button onclick="save()">Guardar</button></div><div class="card"><h2>Lecturas</h2><div id="list"></div></div></section>
<section id="history" class="hidden"><div class="card"><h2>Histórico</h2><div id="hist"></div></div></section>
<section id="settings" class="hidden"><div class="card"><h2>Ajustes</h2><label>Día de control</label><input id="control" type="number" value="23"><label>Cuota del periodo (km)</label><input id="quota" type="number" value="2500"><label>Límite especial (km)</label><input id="special" type="number" value="9000"><button onclick="settings()">Guardar ajustes</button></div></section></div>
<nav><button onclick="show('home')">⌂<br>Inicio</button><button onclick="show('register')">＋<br>Registrar</button><button onclick="show('history')">▤<br>Histórico</button><button onclick="show('settings')">⚙<br>Ajustes</button></nav>
<script>
const KEY='kmscontrol';let d=JSON.parse(localStorage.getItem(KEY)||'null')||{quota:2500,limit:9000,control:23,readings:[]};
const fmt=n=>Math.round(n).toLocaleString('es-ES');function saveD(){localStorage.setItem(KEY,JSON.stringify(d))}
function latest(){return d.readings.slice().sort((a,b)=>b.date-a.date)[0]}
function calc(){let r=latest();if(!r)return null;let excess=Math.max(r.km-d.limit,0),balance=d.quota-excess,dt=new Date(r.date),days=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate()-dt.getDate()+1;return{r,excess,balance,perDay:Math.max(balance,0)/Math.max(days,1)}}
function render(){let c=calc();if(c){km.textContent=fmt(c.r.km)+' km';limit.textContent=fmt(d.limit);excess.textContent='+'+fmt(c.excess);balance.textContent=fmt(Math.max(c.balance,0));day.textContent=c.balance>0?c.perDay.toFixed(1).replace('.',','):'0';status.className=c.excess?'red':'green';status.textContent=c.excess?'+'+fmt(c.excess)+' km de más':'Dentro del objetivo';info.textContent=c.excess?'Has hecho '+fmt(c.excess)+' km de más. Saldo restante: '+fmt(Math.max(c.balance,0))+' km.':'Sin exceso respecto al límite.'}
list.innerHTML=d.readings.length?'<table><tr><th>Fecha</th><th>Km</th></tr>'+d.readings.slice().sort((a,b)=>b.date-a.date).map(x=>'<tr><td>'+new Date(x.date).toLocaleDateString('es-ES')+'</td><td>'+fmt(x.km)+'</td></tr>').join('')+'</table>':'Sin lecturas';
hist.innerHTML=d.readings.length?'<table><tr><th>Fecha</th><th>Km</th><th>Exceso</th><th>Saldo</th></tr>'+d.readings.slice().sort((a,b)=>b.date-a.date).map(x=>{let e=Math.max(x.km-d.limit,0),b=d.quota-e;return '<tr><td>'+new Date(x.date).toLocaleDateString('es-ES')+'</td><td>'+fmt(x.km)+'</td><td>+'+fmt(e)+'</td><td>'+fmt(Math.max(b,0))+'</td></tr>'}).join('')+'</table>':'Sin datos'}
function show(id){['home','register','history','settings'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));render()}
function save(){let v=Number(input.value);if(v>=0){d.readings.push({km:v,date:Date.now()});saveD();input.value='';show('home')}}
function settings(){d.control=Number(control.value)||23;d.quota=Number(quota.value)||2500;d.limit=Number(special.value)||9000;saveD();show('home')}render();
</script></body></html>
